<div onclick="location.href='/event?event_id={{ event_id }}';" class="event_card" style="background-image: url('static/images/{{ event.flyer_filename }}');">
    <h3>{{ event.title }}</h3>
    <b>artists: </b> 
    {% for artist in event.artists %}
    <li>{{ artist }}</li>
    {% endfor %}
    <b>location: </b><p>{{ event.location }}</p>
    <b>description: </b>
    <p>{{ event.description }}</p>
</div>
